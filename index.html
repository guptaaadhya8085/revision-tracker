
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aadhya Revision Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#08111f;color:#fff;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 20%,#7c3aed55,transparent 30%),radial-gradient(circle at 80% 30%,#06b6d455,transparent 30%),radial-gradient(circle at 50% 80%,#ec489955,transparent 30%),#08111f}
.wrap{max-width:1200px;margin:auto;padding:20px}
h1{margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.card{background:rgba(255,255,255,.08);backdrop-filter:blur(18px);border-radius:22px;padding:18px;border:1px solid rgba(255,255,255,.1);transition:.3s}
.card:hover{transform:translateY(-6px) rotateX(4deg)}
.big{font-size:2rem;font-weight:bold}
input,button,select{padding:12px;border:none;border-radius:12px}
input,select{background:#ffffff12;color:#fff}
button{cursor:pointer;background:linear-gradient(135deg,#7c3aed,#06b6d4);color:#fff;font-weight:bold}
.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin:20px 0}
ul{list-style:none}
li{display:flex;justify-content:space-between;align-items:center;padding:12px;margin:10px 0;background:#ffffff0d;border-radius:14px}
.done{text-decoration:line-through;opacity:.6}
.progress{height:14px;background:#ffffff15;border-radius:20px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#22c55e,#06b6d4);width:0%;transition:.5s}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#ffffff15;margin:4px}
.heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.day{height:22px;border-radius:5px;background:#1e293b}
.active{background:#22c55e}
@media(max-width:700px){.controls{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
<h1>🚀 Aadhya Revision Pro</h1>

<div class="grid">
<div class="card"><div id="tasks" class="big">0</div>Total Tasks</div>
<div class="card"><div id="done" class="big">0</div>Completed</div>
<div class="card"><div id="xp" class="big">0</div>XP</div>
<div class="card"><div id="level" class="big">1</div>Level</div>
</div>

<div class="card" style="margin-top:15px">
<h3>🔥 Streak & Progress</h3>
<div class="progress"><div class="fill" id="fill"></div></div>
<p id="percent">0%</p>
<p>Current Streak: <span id="streak">0</span> days</p>
</div>

<div class="controls">
<input id="subject" placeholder="Subject">
<input id="topic" placeholder="Topic">
<button onclick="addTask()">Add</button>
</div>

<div class="card">
<h3>📚 Revision Tasks</h3>
<ul id="list"></ul>
</div>

<div class="grid" style="margin-top:15px">
<div class="card">
<h3>🏆 Achievements</h3>
<div id="badges"></div>
</div>

<div class="card">
<h3>📅 Study Heatmap</h3>
<div class="heatmap" id="heat"></div>
</div>

<div class="card">
<h3>📈 Insight</h3>
<p id="insight">Start studying to unlock insights.</p>
</div>
</div>
</div>

<script>
let data=JSON.parse(localStorage.getItem("revpro"))||{tasks:[],streak:0};

function save(){
localStorage.setItem("revpro",JSON.stringify(data));
render();
}

function addTask(){
let s=subject.value.trim();
let t=topic.value.trim();
if(!s||!t)return;
data.tasks.push({s,t,done:false});
subject.value="";topic.value="";
save();
}

function toggle(i){
if(!data.tasks[i].done){
data.tasks[i].done=true;
data.streak++;
}else{
data.tasks[i].done=false;
}
save();
}

function del(i){data.tasks.splice(i,1);save();}

function render(){
list.innerHTML="";
data.tasks.forEach((x,i)=>{
let li=document.createElement("li");
li.innerHTML=`<div class="${x.done?'done':''}"><b>${x.s}</b><br>${x.t}</div>
<div><button onclick="toggle(${i})">✓</button>
<button onclick="del(${i})">🗑</button></div>`;
list.appendChild(li);
});

let total=data.tasks.length;
let done=data.tasks.filter(x=>x.done).length;
let xp=done*25;
let lvl=Math.floor(xp/100)+1;
let pct=total?Math.round(done*100/total):0;

tasks.textContent=total;
document.getElementById("done").textContent=done;
document.getElementById("xp").textContent=xp;
level.textContent=lvl;
fill.style.width=pct+"%";
percent.textContent=pct+"% Completed";
streak.textContent=data.streak;

badges.innerHTML="";
if(done>=1) badges.innerHTML+='<span class="badge">🎯 First Revision</span>';
if(done>=5) badges.innerHTML+='<span class="badge">🔥 Consistent</span>';
if(done>=10) badges.innerHTML+='<span class="badge">🏆 Study Master</span>';

heat.innerHTML="";
for(let i=0;i<35;i++){
let d=document.createElement("div");
d.className="day"+(i<Math.min(done,35)?" active":"");
heat.appendChild(d);
}

let subjects={};
data.tasks.forEach(t=>subjects[t.s]=(subjects[t.s]||0)+1);
let top=Object.keys(subjects).sort((a,b)=>subjects[b]-subjects[a])[0];
insight.textContent=top?`${top} is your most revised subject.`:"Start studying to unlock insights.";
}
render();
</script>
</body>
</html>
